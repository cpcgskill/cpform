name: Lint (Pylint)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - py: "3.9"
            image: "python:3.9-slim"
            pylint: "pylint~=3.2"     # Pylint 3.x 支持 Python >=3.8
          - py: "3.7"
            image: "python:3.7-slim"
            pylint: "pylint~=2.17"    # Pylint 2.17 是 py3.7 的最后一代
          - py: "2.7"
            image: "python:2.7-slim"
            pylint: "pylint==1.9.5"   # py2.7 需老版本
            astroid: "astroid==1.6.5" # 与 1.9.5 匹配
            legacy: true

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: python -V

      - name: Install dependencies
        run: |
          if [ "${{ matrix.py }}" = "2.7" ]; then
            # py2.7 的 pip/setuptools 需锁旧版本以避免不兼容
            python -m pip install "pip<21" "setuptools<45" "wheel<0.35"
            pip install "${{ matrix.pylint }}" "${{ matrix.astroid }}"
          else
            python -m pip install --upgrade pip
            pip install "${{ matrix.pylint }}"
          fi

      - name: Analysing the code with pylint
        # 老版本（py2.7）允许软失败
        continue-on-error: ${{ matrix.legacy == true }}
        shell: bash
        run: |
          files=$(git ls-files 'src/*.py')
          if [ -z "$files" ]; then
            echo "No Python files under src/. Skipping."
            exit 0
          fi
          pylint $files
