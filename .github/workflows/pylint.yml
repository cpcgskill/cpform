name: Lint (Pylint)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - py: "3.9"
            image: "python:3.9-slim"
            pylint: "pylint~=3.2"
          - py: "3.7"
            image: "python:3.7-slim"
            pylint: "pylint~=2.17"
          - py: "2.7"
            image: "python:2.7-slim"
            pylint: "pylint==1.9.5"
            astroid: "astroid==1.6.5"
            legacy: true

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: python -V

      - name: Install dependencies
        run: |
          if [ "${{ matrix.py }}" = "2.7" ]; then
            python -m pip install "pip<21" "setuptools<45" "wheel<0.35"
            pip install "${{ matrix.pylint }}" "${{ matrix.astroid }}"
          else
            python -m pip install --upgrade pip
            pip install "${{ matrix.pylint }}"
          fi

      - name: Analysing the code with pylint (no git)
        continue-on-error: ${{ matrix.legacy == true }}
        shell: sh
        run: |
          if [ -d src ]; then
            files="$(find src -type f -name '*.py')"
          else
            files=""
          fi
          if [ -z "$files" ]; then
            echo "No Python files under src/. Skipping."
            exit 0
          fi
          pylint $files
